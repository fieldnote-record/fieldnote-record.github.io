; Fieldnote Turntable Bridge — ESP32 (classic) firmware
; Receives Bluetooth A2DP audio from a turntable and streams raw PCM over USB serial.

[env:esp32dev]
platform = espressif32@6.12.0
board = esp32dev
framework = arduino
board_build.partitions = huge_app.csv
monitor_speed = 2000000
build_flags =
  -DCORE_DEBUG_LEVEL=0
lib_deps =
  https://github.com/pschatzmann/ESP32-A2DP.git#v1.8.5
